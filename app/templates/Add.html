{% extends "base.html" %}
{% block title %}Add user · UserFlow{% endblock %}
{% block content %}
<header class="topbar"><div><p class="eyebrow">Directory</p><h1>Add a new user</h1><p class="subtitle">Create a profile for your directory.</p></div></header>
<section class="form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit" class="btn btn-primary">Save user</button><a href="/" class="btn btn-light">Cancel</a></div></form></section>
{% endblock %}
