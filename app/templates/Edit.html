{% extends "base.html" %}
{% block title %}Edit user · UserFlow{% endblock %}
{% block content %}
<header class="topbar"><div><p class="eyebrow">Directory</p><h1>Edit user</h1><p class="subtitle">Keep this profile information up to date.</p></div></header>
<section class="form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit" class="btn btn-primary">Update user</button><a href="/" class="btn btn-light">Cancel</a></div></form></section>
{% endblock %}
