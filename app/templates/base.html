{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UserFlow{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#101d3b; --navy-light:#1b2c52; --blue:#5577f4; --ink:#17213a; --muted:#75809a; --line:#e7eaf2; --bg:#f5f7fb; }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background:var(--bg); font-family:"DM Sans",sans-serif; }
        a { color:inherit; text-decoration:none; }
        .app-shell { display:flex; min-height:100vh; }
        .sidebar { width:250px; flex:none; padding:28px 18px; color:#fff; background:var(--navy); }
        .brand { display:flex; align-items:center; gap:11px; padding:0 12px 38px; font:700 22px "Outfit",sans-serif; }
        .brand-mark { display:grid; place-items:center; width:35px; height:35px; color:var(--navy); background:#8ea7ff; border-radius:11px; font-weight:700; }
        .nav-label { margin:0 12px 12px; color:#8492b5; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
        .nav-link { display:flex; align-items:center; gap:13px; margin:4px 0; padding:13px 14px; color:#b8c2db; border-radius:12px; font-weight:600; transition:.2s; }
        .nav-link:hover, .nav-link.active { color:#fff; background:var(--navy-light); }
        .nav-icon { width:20px; text-align:center; font-size:17px; }
        .sidebar-foot { position:fixed; bottom:25px; width:214px; padding:15px; color:#aab6d0; background:#172746; border-radius:14px; font-size:12px; line-height:1.5; }
        .main { width:calc(100% - 250px); padding:35px 5%; }
        .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:30px; }
        .eyebrow { margin:0 0 7px; color:var(--blue); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
        h1,h2 { margin:0; font-family:"Outfit",sans-serif; }
        h1 { font-size:32px; } h2 { font-size:23px; }
        .subtitle { margin:8px 0 0; color:var(--muted); }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:11px 17px; border:0; border-radius:10px; font-weight:700; cursor:pointer; transition:.2s; }
        .btn-primary { color:#fff; background:var(--blue); box-shadow:0 7px 16px #5577f433; }
        .btn-primary:hover { background:#4164e4; transform:translateY(-1px); }
        .btn-light { color:var(--ink); background:#eef1f7; } .btn-danger { color:#c7364d; background:#fff0f2; }
        .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:25px; }
        .stat-card,.panel,.form-card,.detail-card,.confirm-card { padding:24px; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px #17213a08; }
        .stat-card { display:flex; align-items:center; gap:15px; }
        .stat-icon { display:grid; place-items:center; width:48px; height:48px; color:var(--blue); background:#edf1ff; border-radius:14px; font-size:21px; }
        .stat-label { color:var(--muted); font-size:12px; font-weight:600; } .stat-number { margin-top:3px; font:700 25px "Outfit",sans-serif; }
        .panel-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
        .search { display:flex; gap:8px; width:min(340px,100%); }
        .search input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; outline:0; font:inherit; }
        .search input:focus, input:focus, select:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #5577f41c; }
        .table-wrap { overflow:auto; } table { width:100%; min-width:750px; border-collapse:collapse; } th { color:var(--muted); font-size:11px; letter-spacing:.6px; text-align:left; text-transform:uppercase; } th,td { padding:14px 12px; border-bottom:1px solid var(--line); } td { font-size:14px; } tr:last-child td { border-bottom:0; }
        .avatar { width:40px; height:40px; object-fit:cover; border-radius:12px; vertical-align:middle; } .name-cell { display:flex; align-items:center; gap:11px; font-weight:700; } .email { color:var(--muted); }
        .actions { display:flex; gap:7px; } .action-link { padding:7px 9px; color:var(--muted); background:#f6f7fa; border-radius:8px; font-size:12px; font-weight:700; } .action-link:hover { color:var(--blue); }
        .empty { padding:44px 15px; color:var(--muted); text-align:center; }
        .form-card,.detail-card,.confirm-card { max-width:760px; margin:0 auto; } .form-card form p { margin:0 0 17px; } label { display:block; margin-bottom:7px; font-size:13px; font-weight:700; } input,select,textarea { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font:inherit; } .form-actions { display:flex; gap:10px; margin-top:25px; }
        .detail-grid { display:grid; grid-template-columns:145px 1fr; gap:15px; align-items:center; } .detail-grid dt { color:var(--muted); font-size:13px; font-weight:700; } .detail-grid dd { margin:0; font-weight:600; }
        .profile-photo { width:110px; height:110px; object-fit:cover; border-radius:25px; } .confirm-card { text-align:center; } .confirm-icon { margin:0 auto 15px; font-size:40px; }
        @media (max-width:800px) { .sidebar { width:75px; padding:22px 10px; } .brand { padding:0 10px 35px; } .brand span,.nav-label,.nav-link span,.sidebar-foot { display:none; } .nav-link { justify-content:center; padding:13px 8px; } .main { width:calc(100% - 75px); padding:25px 4%; } .stats { grid-template-columns:1fr; } .topbar,.panel-head { align-items:stretch; flex-direction:column; } .search { width:100%; } h1 { font-size:27px; } }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a href="/" class="brand"><span class="brand-mark">U</span><span>UserFlow</span></a>
        <p class="nav-label">Workspace</p>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
        <a href="/Add/" class="nav-link {% if '/Add/' in request.path %}active{% endif %}"><span class="nav-icon">＋</span><span>Add user</span></a>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><span class="nav-icon">♙</span><span>Users</span></a>
        <div class="sidebar-foot">Manage your people<br>in one simple place.</div>
    </aside>
    <main class="main">{% block content %}{% endblock %}</main>
</div>
</body>
</html>
