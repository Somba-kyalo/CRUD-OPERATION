{% extends "base.html" %}
{% block title %}Delete user · UserFlow{% endblock %}
{% block content %}
<section class="confirm-card"><div class="confirm-icon">⚠</div><h1>Delete this user?</h1><p class="subtitle">This action cannot be undone. The profile will be permanently removed.</p><form method="post" class="form-actions" style="justify-content:center">{% csrf_token %}<button type="submit" class="btn btn-danger">Delete user</button><a href="/" class="btn btn-light">Keep user</a></form></section>
{% endblock %}
